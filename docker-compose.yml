services:
  knowledge-brain:
    build: .
    env_file:
      - .env
    volumes:
      - ./state:/app/state
      - ./logs:/app/logs
    command: ["doctor"]

  # Optional local Qdrant for development/testing when QDRANT_URL is not
  # pointed at a hosted cluster. Not used by default (.env points at a
  # hosted cluster); start with `docker compose --profile local-qdrant up`.
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["local-qdrant"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
