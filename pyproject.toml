[project]
name = "knowledge-brain"
version = "0.1.0"
description = "Resumable Dropbox -> Qdrant knowledge indexer with multilingual embeddings"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "dropbox>=12.0.2",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.2.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.2",
    "python-pptx>=1.0.2",
    "PyYAML>=6.0.1",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "python-dotenv>=1.0.1",
    "tenacity>=8.3.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
knowledge-brain = "knowledge_brain.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
